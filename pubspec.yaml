    sdk: flutter
  camera: ^0.11.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  http: ^1.6.0
  path_provider: ^2.1.6
  shared_preferences: ^2.5.5
  path: ^1.9.1
dev_dependencies:
  flutter_lints: ^6.0.0

flutter:
