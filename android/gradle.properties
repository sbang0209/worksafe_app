org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# 다중 PC(C드라이브/D드라이브) 경로 차이로 인한 증분 캐시 충돌 방지
kotlin.incremental=false
# flutter_vision 이 물고 오는 com.google.ai.edge.litert:litert-support 와
# litert-support-api 가 같은 네임스페이스(org.tensorflow.lite.support)를 선언해
# AGP 9 매니페스트 병합이 실패하는 문제의 임시 우회.
# 업스트림 이슈: https://github.com/google-ai-edge/LiteRT/issues/6965
# Google 쪽에서도 "단기 임시방편, 향후 AGP 버전에서 제거될 수 있음"이라고 명시함 —
# LiteRT 쪽 매니페스트가 고쳐지면 이 줄은 지워도 된다.
android.uniquePackageNames=false
